<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPKS - PT. Cipta Karya Palma</title>
  
  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #F8F3E8, #EFE6D4);
      color: #2E2E2E;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* Premium Luxury Glassmorphism & Shadow */
    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #E7DCC7;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(200, 150, 46, 0.08);
    }
    
    /* Retina Optimized SVG Logo Container */
    .logo-container {
      width: 140px;
      max-width: 140px;
      height: auto;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container svg {
      width: 100%;
      height: auto;
    }
    
    .luxury-input {
      background: #FFFFFF;
      border: 1px solid #E7DCC7;
      color: #2E2E2E;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .luxury-input::placeholder {
      color: #707070;
    }
    
    .luxury-input:focus {
      outline: none;
      border-color: #C8962E;
      box-shadow: 0 0 0 3px rgba(200, 150, 46, 0.15);
      background: #FFFFFF;
    }
    
    /* Gradient Gold Luxury Button */
    .btn-login {
      background: linear-gradient(90deg, #C8962E, #D8B867);
      color: #FFFFFF;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(200, 150, 46, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
    }
    
    .btn-login:hover {
      box-shadow: 0 6px 20px rgba(200, 150, 46, 0.4);
      transform: translateY(-2px);
    }

    /* General Panel Elements */
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #E7DCC7;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.03);
    }
    
    .glass-input {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #E7DCC7;
      color: #2E2E2E;
    }
    .glass-input:focus { 
      outline: none; 
      border-color: #C8962E; 
      background: #FFFFFF; 
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px;}
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D8B867; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #C8962E; }
    
    /* Premium Loading Ring */
    .loader { 
      border: 4px solid rgba(200, 150, 46, 0.2);
      border-left-color: #C8962E; 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    
    .page-transition { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #E7DCC7; }
    th { background-color: rgba(200, 150, 46, 0.1); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; color: #2E2E2E; }
    tr:hover { background-color: rgba(200, 150, 46, 0.05); }

    .skeleton {
      background: linear-gradient(90deg, rgba(200,150,46,0.05) 25%, rgba(200,150,46,0.1) 50%, rgba(200,150,46,0.05) 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes skeletonLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* RESPONSIVE SIPKS: fullscreen auth + mobile offcanvas sidebar */
    html, body { width: 100%; max-width: 100%; min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; }
    #app { min-width: 0; min-height: 100vh; min-height: 100dvh; }
    .auth-screen { min-height: 100vh; min-height: 100dvh; width: 100%; }
    .auth-stage { min-height: calc(100vh - 56px); min-height: calc(100dvh - 56px); }
    .sipks-sidebar { height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; }
    .sipks-sidebar-nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .sipks-sidebar-footer { flex: 0 0 auto; margin-top: auto; padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .sipks-mobile-overlay { position: fixed; inset: 0; background: rgba(20, 24, 32, .55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); z-index: 39; }
    .sipks-mobile-drawer { position: fixed !important; inset: 0 auto 0 0; z-index: 40 !important; width: min(82vw, 320px) !important; height: 100vh !important; height: 100dvh !important; max-height: 100vh !important; max-height: 100dvh !important; display: flex !important; transform: translateX(-105%); transition: transform .25s ease; box-shadow: 16px 0 40px rgba(0,0,0,.18); }
    .sipks-mobile-drawer.is-open { transform: translateX(0); }
    .sipks-mobile-drawer .sipks-sidebar-nav { min-height: 0; overflow-y: auto; }
    .sipks-mobile-header { position: sticky; top: 0; flex: 0 0 auto; padding-top: max(.75rem, env(safe-area-inset-top)); }
    body.sipks-drawer-open { overflow: hidden; }
    @media (max-width: 767px) {
      body { font-size: 14px; }
      .auth-screen { justify-content: flex-start; }
      .auth-stage { width: 100%; flex: 1 0 auto; padding: max(1.25rem, env(safe-area-inset-top)) 0 1.25rem !important; }
      .auth-panel { width: 100%; max-width: none; min-height: calc(100dvh - 56px - env(safe-area-inset-top)); padding: 1.5rem 1.25rem !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; background: rgba(255,255,255,.58) !important; }
      .auth-panel .logo-container { width: 112px; max-width: 112px; }
      .auth-panel .text-center.mb-8 { margin-bottom: 1.5rem; }
      .auth-panel input { min-height: 46px; font-size: 16px; }
      .auth-panel .grid.grid-cols-2 { grid-template-columns: minmax(0, 1fr); gap: .75rem; }
      .auth-footer { padding-bottom: max(.85rem, env(safe-area-inset-bottom)); }
      #app { overflow-x: clip; }
      .sipks-main { width: 100%; min-width: 0; min-height: 100dvh; }
      .sipks-content { min-width: 0; overflow-x: auto; }
      .sipks-mobile-header { display: flex; align-items: center; justify-content: flex-start !important; gap: .75rem; }
      .sipks-mobile-header .sipks-brand-title { margin-left: .15rem; }
      .sipks-mobile-drawer .sipks-sidebar-footer { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
    }
    @media (min-width: 768px) {
      .sipks-mobile-drawer { position: relative !important; inset: auto; width: 18rem !important; height: 100dvh !important; transform: none !important; box-shadow: none; }
      .sipks-mobile-overlay { display: none !important; }
    }
  </style>
</head>
<body class="antialiased min-h-screen flex text-sm sm:text-base">

  <!-- GLOBAL OVERLAY LOADING -->
  <div id="global-loader" class="fixed inset-0 bg-[#2E2E2E]/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
    <div class="loader mb-4"></div>
    <p class="text-[#D8B867] font-medium tracking-wider animate-pulse">Memproses Data...</p>
  </div>

  <!-- CONTAINER UTAMA SPA -->
  <div id="app" class="w-full min-h-screen flex"></div>

  <!-- SCRIPT LOGIC (SPA CONTROLLER) -->
  <script>
    /*========================================================================
      STATE MANAGEMENT & API WRAPPER
    ========================================================================*/
    const AppState = {
      user: null,
      token: localStorage.getItem('sipks_token') || null,
      currentView: 'dashboard'
    };

    // Vector Logo SVG (Retina Ready, No Blur)
    const logoSvg = `
      <svg viewBox="0 0 600 350" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M400 135 C380 90, 240 90, 200 135 C160 180, 180 250, 250 250 L400 250" stroke="#1B2D4A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M300 250 L300 110 L400 110 C460 110, 460 180, 400 180 L300 180 L420 250" stroke="#C8962E" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M220 230 L220 190 M235 230 L235 170 M250 230 L250 150 M265 230 L265 130" stroke="#C8962E" stroke-width="12" stroke-linecap="round"/>
      </svg>
    `;

    const apiCall = (action, table = null, payload = null, options = {}) => {
      return new Promise((resolve, reject) => {
        if (!options.silent) showLoader();
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          if (!options.silent) hideLoader();
          reject("Google Apps Script tidak tersedia. Buka aplikasi melalui URL Web App /exec.");
          return;
        }
        google.script.run
          .withSuccessHandler(res => {
            if (!options.silent) hideLoader();
            if (!res || typeof res.status !== 'boolean') {
              reject("Respons server tidak valid. Periksa fungsi apiController dan deployment Apps Script.");
            } else if (res.data && res.data.logout) {
              doLogout();
              reject(res.message || "Sesi berakhir. Silakan login kembali.");
            } else if (!res.status) {
              reject(res.message || "Permintaan tidak berhasil.");
            } else {
              resolve(res.data !== null && res.data !== undefined ? res.data : res.message);
            }
          })
          .withFailureHandler(err => {
            if (!options.silent) hideLoader();
            reject((err && err.message) || "Terjadi kesalahan saat menghubungi Google Apps Script.");
          })
          .apiController({ token: AppState.token, action, table, payload });
      });
    };

    function normalizeRoleClient(role) {
      const value = String(role || '').trim().toUpperCase();
      if (value === 'USER' || value === 'PENGGUNA') return 'USER';
      if (value === 'OPERATOR' || value === 'OPERATOR BARU') return 'Operator';
      if (value === 'ADMIN') return 'Admin';
      if (value === 'DEVELOPER') return 'Developer';
      if (value === 'MANAGER') return 'Manager';
      return String(role || '').trim();
    }
    function isUserRole() { return normalizeRoleClient(AppState.user && AppState.user.role) === 'USER'; }
    function canOperateAdmin() {
      return ['Admin', 'Operator', 'Developer'].includes(normalizeRoleClient(AppState.user && AppState.user.role));
    }
    const showLoader = () => {
    const loader = document.getElementById('global-loader');
    // if (loader) loader.classList.remove('hidden');
    };

    const hideLoader = () => {
    const loader = document.getElementById('global-loader');
    if (loader) loader.classList.add('hidden');
    };

    const Toast = Swal.mixin({
      toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
      timerProgressBar: true, background: '#2E2E2E', color: '#fff'
    });

    /*========================================================================
      ROUTER & VIEW ENGINE
    ========================================================================*/
    function initApp() {
      const savedUser = localStorage.getItem('sipks_user');
      if (AppState.token && savedUser) {
        AppState.user = JSON.parse(savedUser);
        renderLayout();
      } else {
        renderAuth();
      }
    }

    function renderAuth(mode = 'login') {
      const app = document.getElementById('app');

      app.innerHTML = `
        <div class="auth-screen w-full min-h-screen flex flex-col justify-between">
          <div class="auth-stage flex-1 w-full flex items-center justify-center p-4 py-10">
            <div class="login-card auth-panel w-full max-w-md p-8 page-transition mx-auto relative">
              <div class="text-center mb-8">
                <div class="logo-container mb-4">
                  ${logoSvg}
                </div>
                <h1 class="text-3xl font-extrabold text-[#2E2E2E] tracking-tight">SIPKS</h1>
                <p class="text-[#707070] text-sm mt-1 font-medium">Sistem Informasi Perusahaan Kelapa Sawit</p>
              </div>
              
              ${mode === 'login' ? `
                <form id="authForm" onsubmit="handleAuth(event, 'login')">
                  <div class="mb-4 text-left">
                    <label class="block text-sm mb-1 text-[#2E2E2E] font-semibold">Username</label>
                    <div class="relative">
                      <i class="fas fa-user absolute left-4 top-4 text-[#C8962E]"></i>
                      <input type="text" id="username" required class="luxury-input w-full pl-11 pr-4 py-3 rounded-xl" placeholder="Masukkan Username">
                    </div>
                  </div>
                  <div class="mb-6 text-left">
                    <label class="block text-sm mb-1 text-[#2E2E2E] font-semibold">Password</label>
                    <div class="relative">
                      <i class="fas fa-lock absolute left-4 top-4 text-[#C8962E]"></i>
                      <input type="password" id="password" required class="luxury-input w-full pl-11 pr-4 py-3 rounded-xl" placeholder="••••••••">
                    </div>
                    <div class="text-right mt-2">
                      <a href="javascript:void(0)" onclick="renderAuth('forgot')" class="text-xs text-[#C8962E] hover:text-[#D8B867] transition font-semibold">Lupa Password?</a>
                    </div>
                  </div>
                  <button type="submit" class="w-full btn-login py-3 font-semibold text-lg">
                    Masuk Sistem
                  </button>
                  <p class="text-center mt-6 text-sm text-[#707070]">Belum punya akun? <a href="javascript:void(0)" onclick="renderAuth('register')" class="text-[#C8962E] font-semibold hover:underline transition">Daftar sekarang</a></p>
                </form>
              ` : mode === 'register' ? `
                <form id="authForm" onsubmit="handleAuth(event, 'register')">
                  <div class="mb-4">
                    <input type="text" id="reg_username" required class="luxury-input w-full px-4 py-3 text-sm rounded-xl" placeholder="Username">
                  </div>
                  <div class="mb-4">
                    <input type="email" id="reg_email" required class="luxury-input w-full px-4 py-3 text-sm rounded-xl" placeholder="Email Aktif">
                  </div>
                  <div class="grid grid-cols-2 gap-4 mb-6">
                    <input type="password" id="reg_password" required class="luxury-input w-full px-4 py-3 text-sm rounded-xl" placeholder="Password">
                    <input type="password" id="reg_conf" required class="luxury-input w-full px-4 py-3 text-sm rounded-xl" placeholder="Ulangi Password">
                  </div>
                  <p class="text-xs text-[#707070] mb-4">Pendaftaran mandiri hanya membuat akun USER. Akses Operator ditetapkan secara manual oleh pengelola melalui kolom Role di Spreadsheet.</p>
                  <button type="submit" class="w-full btn-login py-3 font-semibold text-lg">
                    Daftar Sekarang
                  </button>
                  <p class="text-center mt-6 text-sm text-[#707070]"><a href="javascript:void(0)" onclick="renderAuth('login')" class="text-[#C8962E] font-semibold hover:underline transition"><i class="fas fa-arrow-left"></i> Kembali ke Login</a></p>
                </form>
              ` : mode === 'forgot' ? `
                 <form id="authForm" onsubmit="handleAuth(event, 'req_otp')">
                  <p class="text-sm text-[#707070] mb-6 text-center">Masukkan Username dan Email terdaftar untuk pengiriman kode OTP.</p>
                  <div class="mb-4">
                    <input type="text" id="f_username" required class="luxury-input w-full px-4 py-3 rounded-xl mb-4" placeholder="Username Anda">
                    <input type="email" id="f_email" required class="luxury-input w-full px-4 py-3 rounded-xl" placeholder="Email Anda">
                  </div>
                  <button type="submit" class="w-full btn-login py-3 font-semibold text-lg">Minta OTP Reset</button>
                  <p class="text-center mt-6 text-sm text-[#707070]"><a href="javascript:void(0)" onclick="renderAuth('login')" class="text-[#C8962E] font-semibold hover:underline transition">Kembali ke Login</a></p>
                 </form>
              ` : `
                 <form id="authForm" onsubmit="handleAuth(event, 'reset_pass')">
                  <p class="text-sm text-[#C8962E] mb-6 text-center font-semibold">Kode OTP Terkirim! Mohon periksa inbox atau folder spam email Anda.</p>
                  <div class="mb-4">
                    <input type="hidden" id="r_username" value="${window.tempUsername || ''}">
                    <input type="text" id="r_otp" required class="luxury-input w-full px-4 py-3 rounded-xl mb-4 text-center tracking-[8px] font-bold text-lg" placeholder="KODE OTP">
                    <input type="password" id="r_new_password" required class="luxury-input w-full px-4 py-3 rounded-xl mb-4" placeholder="Password Baru">
                    <input type="password" id="r_conf_password" required class="luxury-input w-full px-4 py-3 rounded-xl" placeholder="Konfirmasi Password">
                  </div>
                  <button type="submit" class="w-full btn-login py-3 font-semibold text-lg">Ganti Password</button>
                  <p class="text-center mt-6 text-sm text-[#707070]"><a href="javascript:void(0)" onclick="renderAuth('forgot')" class="text-[#C8962E] font-semibold hover:underline transition">Minta Ulang OTP</a></p>
                 </form>
              `}
            </div>
          </div>
          
          <footer class="auth-footer w-full py-4 text-center bg-[#2E2E2E]">
            <p class="text-white text-xs sm:text-sm font-medium tracking-wide">© 2026 PT. Cipta Karya Palma . All Rights Reserved.</p>
          </footer>
        </div>
      `;
    }

    async function handleAuth(e, mode) {
      e.preventDefault();
      try {
        if (mode === 'login') {
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          const res = await apiCall('login', null, {username, password});
          
          AppState.token = res.token;
          AppState.user = res.user;
          localStorage.setItem('sipks_token', res.token);
          localStorage.setItem('sipks_user', JSON.stringify(res.user));
          Toast.fire({icon: 'success', title: 'Login Berhasil'});
          renderLayout();
          
        } else if (mode === 'register') {
          const pass = document.getElementById('reg_password').value;
          const conf = document.getElementById('reg_conf').value;
          if(pass !== conf) return Toast.fire({icon: 'error', title: 'Konfirmasi password tidak cocok!'});
          const payload = {
            username: document.getElementById('reg_username').value,
            email: document.getElementById('reg_email').value,
            password: pass
          };
          const msg = await apiCall('register', null, payload);
          Swal.fire('Berhasil', msg, 'success');
          renderAuth('login');
          
        } else if (mode === 'req_otp') {
           const username = document.getElementById('f_username').value;
           const email = document.getElementById('f_email').value;
           window.tempUsername = username;
           const msg = await apiCall('req_otp', null, { username, email });
           Swal.fire('Terkirim', msg, 'success');
           renderAuth('reset');
           
        } else if (mode === 'reset_pass') {
           const pass = document.getElementById('r_new_password').value;
           const conf = document.getElementById('r_conf_password').value;
           if(pass !== conf) return Toast.fire({icon: 'error', title: 'Password baru tidak cocok!'});
           
           const payload = { 
               username: document.getElementById('r_username').value, 
               otp: document.getElementById('r_otp').value,
               newPassword: pass
           };
           const msg = await apiCall('reset_pass', null, payload);
           Swal.fire('Berhasil', msg, 'success');
           renderAuth('login');
        }
      } catch (err) {
        Toast.fire({icon: 'error', title: err});
      }
    }

    function doLogout() {
      if (window.sipksRealtimeTimer) { clearInterval(window.sipksRealtimeTimer); window.sipksRealtimeTimer = null; }
      localStorage.removeItem('sipks_token');
      localStorage.removeItem('sipks_user');
      AppState.user = null;
      AppState.token = null;
      renderAuth();
    }

    /*========================================================================
      DASHBOARD LAYOUT & SIDEBAR (SIPKS PT. CIPTA KARYA PALMA)
    ========================================================================*/
    function renderLayout() {
      // PERIKSA ROLE USER KONTRAK
      if (AppState.user) AppState.user.role = normalizeRoleClient(AppState.user.role);
      if (isUserRole()) {
        renderUserDashboard();
        return;
      }

      const isAdmin = normalizeRoleClient(AppState.user.role) === 'Admin';
      const isOperator = normalizeRoleClient(AppState.user.role) === 'Operator';
      const hasAdminMenus = isAdmin || isOperator || normalizeRoleClient(AppState.user.role) === 'Developer';

      let menus = `
        <li class="mb-2"><a href="javascript:void(0)" onclick="navigate('dashboard')" id="nav-dashboard" class="flex items-center px-4 py-3 rounded-lg hover:bg-[#E7DCC7]/50 transition group text-[#707070]"><i class="fas fa-home w-6 group-hover:text-[#C8962E]"></i> Dashboard</a></li>
        
        <div class="mt-4 mb-2 px-4 text-xs font-semibold text-[#D8B867] uppercase tracking-wider">Operasional</div>
        <li class="mb-2"><a href="javascript:void(0)" onclick="navigate('penerimaan')" id="nav-penerimaan" class="flex items-center px-4 py-3 rounded-lg hover:bg-[#E7DCC7]/50 transition group text-[#707070]"><i class="fas fa-inbox w-6 group-hover:text-[#C8962E]"></i> Penerimaan Sawit</a></li>
        <li class="mb-2"><a href="javascript:void(0)" onclick="navigate('timbangan')" id="nav-timbangan" class="flex items-center px-4 py-3 rounded-lg hover:bg-[#E7DCC7]/50 transition group text-[#707070]"><i class="fas fa-balance-scale w-6 group-hover:text-[#C8962E]"></i> Timbangan</a></li>
        <li class="mb-2"><a href="javascript:void(0)" onclick="navigate('transportasi')" id="nav-transportasi" class="flex items-center px-4 py-3 rounded-lg hover:bg-[#E7DCC7]/50 transition group text-[#707070]"><i class="fas fa-truck w-6 group-hover:text-[#C8962E]"></i> Transportasi</a></li>

      document.querySelectorAll('[aria-controls="sipks-sidebar"]').forEach(btn => btn.setAttribute('aria-expanded', String(shouldOpen)));

    function fetchLiveHargaTbsForUser(silent = false) {
      const tglEl = document.getElementById('live-tbs-tanggal');
      const hrgEl = document.getElementById('live-tbs-harga');
      const updEl = document.getElementById('live-tbs-updated');
      const stsEl = document.getElementById('live-tbs-status');

      if (!hrgEl) return;

      // Panggil endpoint get_data HargaTBS
      apiCall('get_data', 'HargaTBS', null, { silent })
        .then(data => {
          if (data && data.length > 0) {
            // Ambil row harga tbs yang terakhir diinput admin
            const lastEntry = data[data.length - 1];
            
            tglEl.innerText = lastEntry.Tanggal || new Date().toISOString().split('T')[0];
            
            const rawHarga = lastEntry.Harga || "0";
            const formatted = new Intl.NumberFormat('id-ID', {
              style: 'currency',
              currency: 'IDR',
              minimumFractionDigits: 0
            }).format(rawHarga);
            
            hrgEl.innerText = formatted;
            updEl.innerText = lastEntry.Waktu_Update || lastEntry.Tanggal;
            
            if (lastEntry.Status === "Berlaku") {
              stsEl.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200";
              stsEl.innerText = "Berlaku";
            } else {
              stsEl.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200";
              stsEl.innerText = "Belum Diperbarui";
            }
          } else {
            hrgEl.innerText = "Belum Diinput";
            stsEl.innerText = "Belum Diperbarui";
          }
        })
        .catch(err => {
          console.error("Gagal sinkronisasi live harga: ", err);
          hrgEl.innerText = "Gagal Memuat";
          stsEl.innerText = "Error Koneksi";
        });
    }

      if (view === 'dashboard') loadDashboard();
      else loadTableView(view);
    }

          <div class="glass p-6 rounded-2xl border-l-4 border-[#D8B867]"><p class="text-[#707070] text-sm font-medium">Total Supplier Mitra</p><h3 id="metric-supplier" class="text-3xl font-bold text-[#2E2E2E] mt-2">${stats.totalSupplier}</h3></div>`;
        ['daily','weekly','monthly'].forEach(p => {

          if (button) button.className = `px-4 py-2 rounded-lg border text-sm ${p === selectedChartPeriod ? 'bg-[#C8962E] text-white border-[#C8962E]' : 'border-[#E7DCC7] text-[#2E2E2E]'}`;
        });

    function startRealtimeRefresh() {

        else if (SCHEMAS[AppState.currentView]) loadTableView(AppState.currentView, true);
      }, 10000);

    const SCHEMAS = {
      penerimaan: { table: 'Penerimaan_Sawit', title: 'Penerimaan Sawit', icon: 'fa-inbox', cols: ['ID_Penerimaan', 'Tanggal', 'No_Kendaraan', 'Supplier', 'Status_Verifikasi'], form: ['Tanggal', 'No_Kendaraan', 'Nama_Sopir', 'Supplier', 'Asal_Estate', 'Asal_Divisi', 'Asal_Blok'] },

      hargatbs: { table: 'HargaTBS', title: 'Harga TBS', icon: 'fa-tags', cols: ['Tanggal', 'Harga', 'Waktu_Update', 'Status'], form: ['Tanggal', 'Harga', 'Status'] },
      users: { table: 'Users', title: 'Manajemen User', icon: 'fa-users-cog', cols: ['Username', 'Email', 'Role', 'Status'], form: ['Username', 'Email', 'Role', 'Status'], isAdminOnly: true },
      log: { table: 'LogActivity', title: 'Log Aktivitas', icon: 'fa-history', cols: ['Timestamp', 'Username', 'Action', 'Description'], form: [], isAdminOnly: true, readonly: true }
    };
    
    let currentTableData = [];

    async function loadTableView(viewKey, silent = false) {
      const schema = SCHEMAS[viewKey];
      if (!schema) return;
      if (isUserRole()) { renderUserDashboard(); return; }
      if (schema.isAdminOnly && !canOperateAdmin()) return;

      const role = normalizeRoleClient(AppState.user.role);
      if (silent) {
        try {
          const latest = await apiCall('get_data', schema.table, null, { silent: true });
          currentTableData = latest;
          const body = document.getElementById('tableBody');
          if (body && AppState.currentView === viewKey) renderTableRows(viewKey, latest, role === 'Admin' || role === 'Operator' || role === 'Developer', role === 'Admin' || role === 'Operator' || role === 'Developer');
        } catch (err) { console.warn('Sinkronisasi tabel gagal:', err); }
        return;
      }
      const canAdd = !schema.readonly && (role === 'Admin' || role === 'Operator');
      const canEdit = !schema.readonly && (role === 'Admin' || role === 'Operator');
      const canDelete = !schema.readonly && (role === 'Admin' || role === 'Operator' || role === 'Developer');

      const container = document.getElementById('main-content');
      container.innerHTML = `
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-2xl font-bold text-[#2E2E2E]"><i class="fas ${schema.icon} mr-2"></i> ${schema.title}</h2>
          </div>
          <div class="flex gap-2">
            <button onclick="exportData('pdf')" class="bg-red-600/95 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm shadow transition"><i class="fas fa-file-pdf"></i> PDF</button>
            <button onclick="exportData('excel')" class="bg-green-600/95 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm shadow transition"><i class="fas fa-file-excel"></i> Excel</button>
            ${canAdd ? `
              <button onclick="showFormModal('${viewKey}')" class="btn-login px-4 py-2 rounded-lg text-sm shadow-lg transition shadow-[#C8962E]/30">
                <i class="fas fa-plus"></i> Tambah Data
              </button>
            ` : ''}
          </div>
        </div>
        
        <div class="glass rounded-xl overflow-hidden shadow-xl">
          <div class="p-4 border-b border-[#E7DCC7] flex justify-between items-center">
            <input type="text" id="searchInput" placeholder="Cari data..." class="glass-input px-4 py-2 rounded-lg text-sm w-64" onkeyup="filterTable()">
          </div>
          <div class="overflow-x-auto w-full">
            <table class="w-full whitespace-nowrap" id="dataTable">
              <thead>
                <tr>
                  <th class="w-12 text-center">No</th>
                  ${schema.cols.map(c => `<th>${c.replace(/_/g, ' ')}</th>`).join('')}
                  ${canEdit || canDelete ? `<th class="text-center w-24">Aksi</th>` : ''}
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="100%" class="text-center py-8 text-[#707070]"><div class="skeleton h-10 w-full mb-2"></div><div class="skeleton h-10 w-full"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- MODAL FORM -->
        <div id="formModal" class="fixed inset-0 bg-[#2E2E2E]/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
          <div class="glass w-full max-w-2xl rounded-2xl shadow-2xl my-8 transform transition-all border border-[#C8962E]/30">
            <div class="p-6 border-b border-[#E7DCC7] flex justify-between items-center bg-[#EFE6D4]/50">
              <h3 class="text-lg font-bold text-[#C8962E]" id="modalTitle">Form</h3>
              <button onclick="closeModal()" class="text-[#707070] hover:text-[#2E2E2E]"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="crudForm" onsubmit="saveData(event, '${viewKey}')" class="p-6 bg-white">
              <input type="hidden" id="form_rowIndex" value="">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="formFields">
                <!-- Fields injected dynamically -->
              </div>
              <div class="mt-6 flex justify-end gap-3 border-t border-[#E7DCC7] pt-4">
                <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg border border-[#E7DCC7] text-[#707070] hover:bg-[#EFE6D4] transition">Batal</button>
                <button type="submit" class="px-5 py-2.5 rounded-lg btn-login text-white font-semibold shadow-lg shadow-[#C8962E]/30 transition">Simpan Data</button>
              </div>
            </form>
          </div>
        </div>
      `;
      try {
        const data = await apiCall('get_data', schema.table);
        currentTableData = data;
        renderTableRows(viewKey, data, canEdit, canDelete);
      } catch(err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="100%" class="text-center py-8 text-red-500">Error: ${err}</td></tr>`;
      }
    }

    function renderTableRows(viewKey, data, canEdit, canDelete) {
      const schema = SCHEMAS[viewKey];
      const tbody = document.getElementById('tableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="100%" class="text-center py-8 text-[#707070]">Tidak ada data ditemukan.</td></tr>`;
        return;
      }

      let html = '';
      data.slice().reverse().forEach((row, idx) => {
        let tr = `<tr><td class="text-center text-[#2E2E2E]">${idx + 1}</td>`;
        schema.cols.forEach(col => {
          let val = row[col] || '-';
          if(col === 'Status' || col === 'Status_Verifikasi') {
            let color = val === 'Pending' ? 'bg-yellow-100 text-yellow-600' : 
                        val === 'Aktif' || val === 'Terverifikasi' || val === 'Berlaku' ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600';
            val = `<span class="px-2 py-1 rounded text-xs font-medium ${color}">${val}</span>`;
          }
          if(typeof val === 'string' && val.startsWith("'")) val = val.substring(1);
          tr += `<td class="text-[#2E2E2E]">${val}</td>`;
        });

        let actionBtns = '';
        if (canEdit) actionBtns += `<button onclick="showFormModal('${viewKey}', ${row._rowIndex})" class="text-[#C8962E] hover:text-[#D8B867] mx-2" title="Edit"><i class="fas fa-edit"></i></button>`;
        if (canDelete) actionBtns += `<button onclick="deleteRow('${viewKey}', ${row._rowIndex})" class="text-red-500 hover:text-red-400 mx-1" title="Hapus"><i class="fas fa-trash"></i></button>`;
        
        if (canEdit || canDelete) tr += `<td class="text-center">${actionBtns}</td>`;
        tr += `</tr>`;
        html += tr;
      });
      tbody.innerHTML = html;
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const trs = document.querySelectorAll('#tableBody tr');
      trs.forEach(tr => {
        tr.style.display = tr.innerText.toLowerCase().includes(input) ? '' : 'none';
      });
    }

    function showFormModal(viewKey, rowIndex = null) {
      const schema = SCHEMAS[viewKey];
      const modal = document.getElementById('formModal');
      document.getElementById('modalTitle').innerText = rowIndex ? `Edit Data ${schema.title}` : `Tambah Data ${schema.title}`;
      document.getElementById('form_rowIndex').value = rowIndex || '';
      const formFields = document.getElementById('formFields');
      let fieldsHtml = '';
      
      let rowData = rowIndex ? currentTableData.find(d => d._rowIndex === rowIndex) : {};

      schema.form.forEach(field => {
        let type = 'text';
        let val = rowData[field] || '';
        let readonly = '';
        
        if (typeof val === 'string' && val.startsWith("'")) val = val.substring(1);

        if (field.includes('Tanggal')) { type = 'date'; if(!val) val = new Date().toISOString().split('T')[0]; }
        else if (field.includes('Kg') || field.includes('Persen') || field.includes('Luas') || field.includes('Tahun') || field === 'Harga') type = 'number';
        
        if (field.includes('ID_')) readonly = rowIndex ? 'readonly' : ''; 

        if (field === 'Status' || field === 'Status_Verifikasi' || field === 'Status_Kendaraan') {
            fieldsHtml += `
              <div>
                <label class="block text-xs mb-1 text-[#707070] font-semibold">${field.replace(/_/g, ' ')}</label>
                <select id="inp_${field}" class="luxury-input w-full px-3 py-2 rounded-lg text-sm" ${readonly}>
                  <option value="Pending" ${val==='Pending'?'selected':''}>Pending</option>
                  <option value="Terverifikasi" ${val==='Terverifikasi'?'selected':''}>Terverifikasi / Aktif</option>
                  <option value="Berlaku" ${val==='Berlaku'?'selected':''}>Berlaku</option>
                  <option value="Nonaktif" ${val==='Nonaktif'?'selected':''}>Ditolak / Nonaktif</option>
                </select>
              </div>`;
        } else if (field === 'Role' && viewKey === 'users') {
             fieldsHtml += `
              <div>
                <label class="block text-xs mb-1 text-[#707070] font-semibold">Role</label>
                <select id="inp_${field}" class="luxury-input w-full px-3 py-2 rounded-lg text-sm">
                  <option value="Operator" ${val==='Operator'?'selected':''}>Operator</option>
                  <option value="USER" ${val==='USER'?'selected':''}>USER</option>
                  <option value="Admin" ${val==='Admin'?'selected':''}>Admin</option>
                </select>
              </div>`;
        } else if (field === 'Alamat') {
            fieldsHtml += `
              <div class="md:col-span-2">
                <label class="block text-xs mb-1 text-[#707070] font-semibold">${field.replace(/_/g, ' ')}</label>
                <textarea id="inp_${field}" class="luxury-input w-full px-3 py-2 rounded-lg text-sm h-24" ${readonly} required>${val}</textarea>
              </div>`;
        } else {
            let inputModeHTML = (field.includes('HP') || field.includes('Tahun') || field.includes('Kg')) ? `inputmode="numeric"` : '';
            fieldsHtml += `
              <div>
                <label class="block text-xs mb-1 text-[#707070] font-semibold">${field.replace(/_/g, ' ')}</label>
                <input type="${type}" id="inp_${field}" value="${val}" ${inputModeHTML} class="luxury-input w-full px-3 py-2 rounded-lg text-sm" ${readonly} required>
              </div>`;
        }
      });
      
      formFields.innerHTML = fieldsHtml;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('formModal').classList.add('hidden');
    }

    async function saveData(e, viewKey) {
      e.preventDefault();
      const schema = SCHEMAS[viewKey];
      const rowIndex = document.getElementById('form_rowIndex').value;
      const payload = {};
      
      schema.form.forEach(field => {
        let el = document.getElementById('inp_' + field);
        if(el) {
           let val = el.value;
           if(field.includes('HP') || field.includes('Kode') || field.includes('Username')) {
               val = "'" + val;
           }
           payload[field] = val;
        }
      });
      
      try {
        let msg;
        if (rowIndex) {
          payload._rowIndex = parseInt(rowIndex);
          msg = await apiCall('update_data', schema.table, payload);
        } else {
          msg = await apiCall('insert_data', schema.table, payload);
        }
        closeModal();
        Toast.fire({icon: 'success', title: msg});
        loadTableView(viewKey);
      } catch(err) {
        Swal.fire('Error', err, 'error');
      }
    }

    async function deleteRow(viewKey, rowIndex) {
      const confirm = await Swal.fire({
        title: 'Hapus Data?', text: "Data tidak dapat dikembalikan!", icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#D8B867',
        confirmButtonText: 'Ya, Hapus!', cancelButtonText: 'Batal', background: '#FFFFFF', color: '#2E2E2E'
      });
      if(confirm.isConfirmed) {
        try {
          const msg = await apiCall('delete_data', SCHEMAS[viewKey].table, { _rowIndex: rowIndex });
          Toast.fire({icon: 'success', title: msg});
          loadTableView(viewKey);
        } catch(err) {
          Swal.fire('Error', err, 'error');
        }
      }
    }

    /*========================================================================
      EXPORT EXCEL & PDF
    ========================================================================*/
    function exportData(type) {
      if(currentTableData.length === 0) return Toast.fire({icon: 'warning', title: 'Tidak ada data untuk diexport'});
      const cleanData = currentTableData.map(row => {
        let obj = {};
        Object.keys(row).forEach(k => { 
           if(k !== '_rowIndex') {
               let val = row[k];
               if(typeof val === 'string' && val.startsWith("'")) val = val.substring(1);
               obj[k] = val; 
           }
        });
        return obj;
      });
      
      const fileName = `Laporan_SIPKS_${new Date().toISOString().split('T')[0]}`;
      
      if (type === 'excel') {
        const ws = XLSX.utils.json_to_sheet(cleanData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `${fileName}.xlsx`);
      } 
      else if (type === 'pdf') {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        doc.setFontSize(16);
        doc.text("Laporan Sistem Informasi - PT. Cipta Karya Palma", 14, 15);
        doc.setFontSize(10);
        doc.text(`Dicetak pada: ${new Date().toLocaleString('id-ID')}`, 14, 22);
        
        const columns = Object.keys(cleanData[0]).map(k => ({header: k.replace(/_/g, ' '), dataKey: k}));
        doc.autoTable({ 
            columns: columns, 
            body: cleanData, 
            startY: 30, 
            styles: { fontSize: 8 }, 
            headStyles: { fillColor: [200, 150, 46] }
        });
        doc.save(`${fileName}.pdf`);
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
